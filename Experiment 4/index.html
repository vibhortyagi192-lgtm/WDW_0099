<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>
   <table border="1" cellspacing="0" cellpadding="8" align="center">
    
  <tr> 
  <td  align="center">
    <h2>Hotel Room Booking Form</h2>
    <form>
        <table cellpadding="3" cellspacing="0">
   <!--Name --> 
   <tr>
    <td align="center">
<label for="full name">Full Name:</label >
<input type="text" id="full name" name="full name" size="15" required><br>
    </td>
   </tr>
<!--Email -->
   <tr>
    <td align="center">
<label for="email">Email:</label>
<input type="email" id="email" name="email" size="15" required><br>
    </td>
   </tr>
<!--Phone -->
   <tr>
    <td align="center">
<label for="phone">Phone:</label>
<input type="text" id="phone" name="phone" size="15" required><br>
    </td>
   </tr>
<!--Check-in Date -->
   <tr>
    <td align="center">
<label for ="checkin">Check-in-Date:</label>
<input type="date" id="checkin" name="checkin"  required><br>
    </td>
   </tr>
<!--Check-Out Date-->
   <tr>
    <td align="center">
<label for ="checkout">Check-Out Date:</label>
<input type ="date" id="checkout" name="checkout"  required><br>
    </td>
   </tr>
<!--Room Type-->
   <tr>
    <td align="center">
<label for="Room Type">Room Type:</label>
<select id="Room Type" name="Room Type"  required>
    <option value="single">Single Room</option>
    <option value="double">Double</option>
    <option value="suite">Suite</option>
</select>
    <br>
    </td>
   </tr>
   <!-- Number of Guests--> 
   <tr>
    <td align="center">
   <label for="guests">Number of Guests:</label>
   <input type="number" id="guests" name="guests" min="1" max="6" size="10" required><br>
   <!--Special Requests-->
   <tr>
    <td colspan="2" align="center">
   <label for="requests">Special Requests:</label><br>
   <textarea id="requests" name="requests" cols="30" rows="3"> </textarea><br>
    </td>
   </tr>
   <tr>
    <td align="center">
<button type="submit">Book Now</button>
<button type="reset">Reset</button>
    </td>
   </tr>
        </table>
    </form>
</td>
</tr>   
</table>
</body>
